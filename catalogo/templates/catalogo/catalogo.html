
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnimeLat | Catálogo</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #101018;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    padding: 22px 5%;
    background: #191923;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo { color: #b66cff; font-size: 28px; font-weight: bold; }

.hero {
    padding: 65px 7%;
    background: linear-gradient(90deg, #24113f, #11111b);
}

.hero h1 { font-size: 38px; }
.hero p { color: #ccc; }

main { padding: 25px 5%; }

.genero { margin-bottom: 45px; }

.genero-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.genero h2 { color: #c28aff; }

.ver-mas {
    background: #8b43dc;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 7px;
    cursor: pointer;
}

.carrusel {
    display: flex;
    gap: 18px;
    overflow-x: auto;
    padding: 15px 0;
}

.carrusel::-webkit-scrollbar { height: 7px; }
.carrusel::-webkit-scrollbar-thumb {
    background: #8145bd;
    border-radius: 10px;
}

.anime {
    min-width: 175px;
    max-width: 175px;
    background: #20202d;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .2s;
}

.anime:hover { transform: translateY(-6px); }

.anime img {
    width: 100%;
    height: 235px;
    object-fit: cover;
}

.anime h3 {
    padding: 0 12px;
    font-size: 15px;
}

.anime p {
    padding: 0 12px;
    color: #aaa;
    font-size: 12px;
}

#contenido { min-height: 200px; }

.volver {
    display: none;
    margin-bottom: 20px;
    background: #333;
    color: white;
    border: none;
    padding: 10px 18px;
    cursor: pointer;
    border-radius: 7px;
}

.vacio { color: #aaa; padding: 20px 0; }

footer {
    padding: 25px;
    text-align: center;
    background: #191923;
    color: #aaa;
}
</style>
</head>

<body>

<header>
    <div class="logo">AnimeLat</div>
    <span>Catálogo de anime</span>
</header>

<section class="hero">
    <h1>Explora tu mundo anime</h1>
    <p>Encuentra tus animes favoritos organizados por géneros.</p>
</section>

<main>
    <button class="volver" id="volver" onclick="cargarCatalogo()">
        ← Volver a categorías
    </button>

    <div id="contenido">
        <p class="vacio">Cargando catálogo...</p>
    </div>
</main>

<footer>AnimeLat © 2026 - Tu catálogo de anime</footer>

<script>
const base = window.location.pathname.endsWith("/")
    ? window.location.pathname
    : window.location.pathname + "/";

const contenido = document.getElementById("contenido");
const botonVolver = document.getElementById("volver");

let todosLosAnimes = [];

async function cargarCatalogo() {
    botonVolver.style.display = "none";
    contenido.innerHTML = "<p class='vacio'>Cargando animes...</p>";

    try {
        const [generosResponse, animesResponse] = await Promise.all([
            fetch(base + "generos/"),
            fetch(base + "animes/")
        ]);

        if (!generosResponse.ok || !animesResponse.ok) {
            throw new Error("No se pudieron cargar los datos.");
        }

        const generos = await generosResponse.json();
        todosLosAnimes = await animesResponse.json();

        contenido.innerHTML = "";

        generos.forEach(genero => {
            const lista = todosLosAnimes.filter(
                anime => anime.genero === genero
            );

            const seccion = document.createElement("section");
            seccion.className = "genero";

            seccion.innerHTML = `
                <div class="genero-header">
                    <h2>${genero}</h2>
                    <button class="ver-mas">Ver más →</button>
                </div>
                <div class="carrusel"></div>
            `;

            const carrusel = seccion.querySelector(".carrusel");

            lista.forEach(anime => {
                carrusel.appendChild(crearTarjeta(anime));
            });

            if (lista.length === 0) {
                carrusel.innerHTML =
                    "<p class='vacio'>Todavía no hay animes en este género.</p>";
            }

            seccion.querySelector(".ver-mas").onclick = () => {
                mostrarCategoria(genero);
            };

            contenido.appendChild(seccion);
        });

        if (generos.length === 0) {
            contenido.innerHTML =
                "<p class='vacio'>No hay géneros registrados todavía.</p>";
        }

    } catch (error) {
        contenido.innerHTML =
            "<p class='vacio'>No se pudo conectar con el catálogo. Revisa las rutas de Django.</p>";
    }
}

function crearTarjeta(anime) {
    const tarjeta = document.createElement("article");
    tarjeta.className = "anime";

    const imagen = document.createElement("img");
    imagen.src = anime.imagen || "https://placehold.co/300x400/20202d/ffffff?text=Anime";
    imagen.alt = anime.titulo;

    const titulo = document.createElement("h3");
    titulo.textContent = anime.titulo;

    const anio = document.createElement("p");
    anio.textContent = "Año: " + anime.anio;

    tarjeta.append(imagen, titulo, anio);

    tarjeta.onclick = () => {
        window.location.href = base + "animes/" + anime.id + "/";
    };

    return tarjeta;
}

function mostrarCategoria(genero) {
    botonVolver.style.display = "inline-block";
    contenido.innerHTML = "";

    const titulo = document.createElement("h1");
    titulo.textContent = "Anime de " + genero;
    contenido.appendChild(titulo);

    const grid = document.createElement("div");
    grid.className = "carrusel";
    grid.style.flexWrap = "wrap";

    const lista = todosLosAnimes.filter(
        anime => anime.genero === genero
    );

    lista.forEach(anime => grid.appendChild(crearTarjeta(anime)));

    if (lista.length === 0) {
        grid.innerHTML = "<p class='vacio'>No hay animes disponibles.</p>";
    }

    contenido.appendChild(grid);
}

cargarCatalogo();
</script>

</body>
</html>
